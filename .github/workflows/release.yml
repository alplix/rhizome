name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            paths: |
              target/release/bundle/nsis/*.exe
          - os: macos-latest
            bundles: dmg,app
            paths: |
              target/release/bundle/dmg/*.dmg
          - os: ubuntu-latest
            bundles: deb,appimage
            paths: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux WebView and keyring dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libdbus-1-dev pkg-config file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the installer
        working-directory: crates/rhizome-app
        run: npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }}
      - name: Checksum (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Get-ChildItem target/release/bundle/nsis/*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Out-File -Encoding ascii "$($_.FullName).sha256"
          }
      - name: Checksum (macOS / Linux)
        if: matrix.os != 'windows-latest'
        run: |
          find target/release/bundle -maxdepth 2 -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -print0 |
            while IFS= read -r -d '' f; do
              shasum -a 256 "$f" | awk -v b="$(basename "$f")" '{ print $1 "  " b }' > "$f.sha256"
            done
      - uses: actions/upload-artifact@v4
        with:
          name: rhizome-${{ matrix.os }}
          path: |
            ${{ matrix.paths }}
            target/release/bundle/nsis/*.sha256
            target/release/bundle/dmg/*.sha256
            target/release/bundle/deb/*.sha256
            target/release/bundle/appimage/*.sha256
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.exe
            dist/**/*.dmg
            dist/**/*.deb
            dist/**/*.AppImage
            dist/**/*.sha256
