<!doctype html>
<html lang="en" data-theme="graphite" data-mode="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <!-- The same policy the application enforces, so opening this page in a browser
       exposes anything that would be blocked there. Scripts and styles come from
       this origin only; there are no inline styles or handlers. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' ipc: http://ipc.localhost; object-src 'none'; base-uri 'none'">
  <title>Rhizome</title>
  <script src="theme-boot.js"></script>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="app">
    <nav id="sidebar" data-i18n-aria="nav.label">
      <header class="pane-head">
        <svg class="logo" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
          <path d="M12 6.500L6 12M12 6.500L18 12M6 12l3 6M18 12l-3 6"/>
          <circle cx="12" cy="5.500" r="2.400"/><circle cx="6" cy="12" r="1.900"/><circle cx="18" cy="12" r="1.900"/>
          <circle cx="9" cy="18.500" r="1.500"/><circle cx="15" cy="18.500" r="1.500"/>
        </svg>
        <span class="brand">Rhizome</span>
        <span class="spacer"></span>
        <button id="btn-networks" class="icon-btn" type="button" data-i18n-title="nav.networks">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </header>
      <div id="buffer-list"></div>
      <footer class="pane-foot">
        <button id="btn-search-side" class="foot-btn" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="6.500"/><path d="M16 16l5 5"/></svg>
          <span data-i18n="nav.search"></span>
        </button>
        <button id="btn-settings-side" class="foot-btn" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
          <span data-i18n="nav.settings"></span>
        </button>
      </footer>
    </nav>

    <main id="main">
      <header id="topbar">
        <button id="toggle-sidebar" class="icon-btn narrow-only" type="button" data-i18n-title="top.show_nav">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div id="title">
          <h1 id="title-name">Rhizome</h1>
          <p id="title-topic"></p>
        </div>
        <span id="status" role="status"></span>
        <button id="btn-search" class="search-pill" type="button">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><circle cx="11" cy="11" r="6.500"/><path d="M16 16l5 5"/></svg>
          <span data-i18n="top.search"></span>
          <kbd>Ctrl K</kbd>
        </button>
        <button id="toggle-members" class="icon-btn" type="button" aria-pressed="true" data-i18n-title="top.members_toggle">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="9" cy="8" r="3.200"/><path d="M3 19c.6-3.200 3-5 6-5s5.400 1.800 6 5"/><path d="M16.500 5.200a3 3 0 010 5.600M18.500 14.200c1.600.8 2.600 2.500 2.900 4.800"/></svg>
        </button>
      </header>

      <div id="context-banner" hidden>
        <span data-i18n="banner.result"></span>
        <button id="btn-live" type="button" data-i18n="banner.back"></button>
      </div>

      <div id="messages" role="log" aria-live="polite" aria-relevant="additions" data-i18n-aria="messages.aria" tabindex="0"></div>

      <section id="welcome" hidden>
        <div class="welcome-card">
          <svg class="welcome-logo" viewBox="0 0 24 24" width="56" height="56" aria-hidden="true">
            <path d="M12 6.500L6 12M12 6.500L18 12M6 12l3 6M18 12l-3 6"/>
            <circle cx="12" cy="5.500" r="2.400"/><circle cx="6" cy="12" r="1.900"/><circle cx="18" cy="12" r="1.900"/>
            <circle cx="9" cy="18.500" r="1.500"/><circle cx="15" cy="18.500" r="1.500"/>
          </svg>
          <h2 data-i18n="welcome.title"></h2>
          <p data-i18n="welcome.text"></p>
          <p class="welcome-sub" data-i18n="welcome.pick"></p>
          <div id="welcome-presets"></div>
          <button id="welcome-add" class="primary" type="button" data-i18n="welcome.custom"></button>
        </div>
      </section>

      <button id="new-pill" type="button" hidden></button>

      <form id="composer" autocomplete="off">
        <div class="composer-box">
          <textarea id="input" rows="1" spellcheck="false" data-i18n-aria="composer.aria"></textarea>
          <button id="btn-send" type="submit" data-i18n-title="composer.send">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
        <p class="composer-hint" data-i18n="composer.hint"></p>
      </form>
    </main>

    <aside id="members-pane" data-i18n-aria="top.members">
      <h2 id="members-title"></h2>
      <ul id="members"></ul>
    </aside>
  </div>

  <div id="toast" role="status" aria-live="polite" hidden></div>

  <!-- Search the log -->
  <dialog id="search-dialog" data-i18n-aria="search.aria">
    <div class="search-box">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="6.500"/><path d="M16 16l5 5"/></svg>
      <input id="search-input" type="search" spellcheck="false" autocomplete="off"
             data-i18n-placeholder="search.placeholder" data-i18n-aria="search.query" aria-controls="search-results">
    </div>
    <div class="search-options">
      <label><span data-i18n="search.where"></span>
        <select id="search-scope">
          <option value="all" data-i18n="search.scope_all"></option>
          <option value="this" data-i18n="search.scope_this"></option>
        </select>
      </label>
      <label><span data-i18n="search.order"></span>
        <select id="search-order">
          <option value="relevance" data-i18n="search.order_relevance"></option>
          <option value="newest" data-i18n="search.order_newest"></option>
        </select>
      </label>
      <span class="spacer"></span>
      <span id="search-count" role="status"></span>
    </div>
    <ul id="search-results" role="listbox" data-i18n-aria="search.results"></ul>
    <p class="search-help">
      <code>from:bob</code> <code>in:#kernel</code> <code>"exact phrase"</code> <code>kmall*</code>
      &nbsp;·&nbsp; <span data-i18n="search.hint"></span>
    </p>
  </dialog>

  <!-- Saved networks -->
  <dialog id="networks-dialog" data-i18n-aria="networks.title">
    <form method="dialog" class="dialog-head">
      <h2 data-i18n="networks.title"></h2>
      <button class="icon-btn" value="close" data-i18n-title="dialog.close">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </form>
    <ul id="profile-list"></ul>
    <div class="dialog-actions">
      <button id="btn-add-network" type="button" class="primary" data-i18n="networks.add"></button>
    </div>
  </dialog>

  <!-- Add or edit a network -->
  <dialog id="profile-dialog" data-i18n-aria="profile.add_title">
    <form id="profile-form" method="dialog" autocomplete="off">
      <h2 id="profile-title"></h2>
      <div class="grid">
        <label class="wide" id="preset-row"><span data-i18n="profile.preset"></span>
          <select id="p-preset"></select>
        </label>
        <label><span data-i18n="profile.name"></span> <input id="p-name" required></label>
        <label><span data-i18n="profile.host"></span> <input id="p-host" required spellcheck="false"></label>
        <label><span data-i18n="profile.port"></span> <input id="p-port" type="number" min="1" max="65535" value="6697"></label>
        <label class="check"><input id="p-tls" type="checkbox" checked> <span data-i18n="profile.tls"></span></label>
        <label><span data-i18n="profile.nick"></span> <input id="p-nick" required spellcheck="false"></label>
        <label><span data-i18n="profile.username"></span> <input id="p-username" spellcheck="false"></label>
        <label><span data-i18n="profile.realname"></span> <input id="p-realname"></label>
        <label><span data-i18n="profile.channels"></span> <input id="p-channels" data-i18n-placeholder="profile.channels_ph" spellcheck="false"></label>
        <label><span data-i18n="profile.account"></span> <input id="p-account" data-i18n-placeholder="profile.account_ph" spellcheck="false"></label>
        <label class="wide"><span data-i18n="profile.cert"></span> <input id="p-cert" data-i18n-placeholder="profile.cert_ph" spellcheck="false"></label>
        <label class="check"><input id="p-autoconnect" type="checkbox"> <span data-i18n="profile.autoconnect"></span></label>
      </div>
      <p class="fine" data-i18n="profile.cert_note"></p>
      <p class="fine" data-i18n="profile.note"></p>
      <output id="profile-error" class="error" hidden></output>
      <div class="dialog-actions">
        <button id="btn-profile-cancel" type="button" data-i18n="dialog.cancel"></button>
        <button type="submit" class="primary" data-i18n="dialog.save"></button>
      </div>
    </form>
  </dialog>

  <!-- Password prompt -->
  <dialog id="password-dialog" data-i18n-aria="password.title">
    <form id="password-form" method="dialog" autocomplete="off">
      <h2 data-i18n="password.title"></h2>
      <label><span id="password-for"></span>
        <input id="password-input" type="password" autocomplete="off" required>
      </label>
      <label class="check"><input id="password-remember" type="checkbox"> <span data-i18n="password.remember"></span></label>
      <p class="fine" data-i18n="password.note"></p>
      <div class="dialog-actions">
        <button id="btn-password-cancel" type="button" data-i18n="dialog.cancel"></button>
        <button type="submit" class="primary" data-i18n="password.connect"></button>
      </div>
    </form>
  </dialog>

  <!-- Confirm a multi-line paste -->
  <dialog id="paste-dialog" data-i18n-aria="paste.title">
    <form id="paste-form" method="dialog">
      <h2 data-i18n="paste.title"></h2>
      <p id="paste-lead"></p>
      <pre id="paste-preview"></pre>
      <p class="fine" data-i18n="paste.note"></p>
      <div class="dialog-actions">
        <button id="btn-paste-cancel" type="button" data-i18n="dialog.cancel"></button>
        <button type="submit" class="primary" id="btn-paste-send"></button>
      </div>
    </form>
  </dialog>

  <!-- Confirm something that cannot be undone -->
  <dialog id="confirm-dialog" data-i18n-aria="dialog.confirm">
    <form id="confirm-form" method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-body"></p>
      <div class="dialog-actions">
        <button id="btn-confirm-cancel" type="button" data-i18n="dialog.cancel"></button>
        <button type="submit" class="danger" id="btn-confirm-ok"></button>
      </div>
    </form>
  </dialog>

  <!-- Settings -->
  <dialog id="settings-dialog" data-i18n-aria="settings.title">
    <form method="dialog" class="dialog-head">
      <h2 data-i18n="settings.title"></h2>
      <button class="icon-btn" value="close" data-i18n-title="dialog.close">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </form>

    <div class="settings-body">
      <section>
        <h3 data-i18n="settings.appearance"></h3>

        <fieldset>
          <legend data-i18n="settings.theme"></legend>
          <div class="theme-grid" id="theme-grid" role="radiogroup"></div>
        </fieldset>

        <fieldset>
          <legend data-i18n="settings.accent"></legend>
          <div class="accent-row" id="accent-row" role="radiogroup"></div>
        </fieldset>

        <div class="two">
          <fieldset>
            <legend data-i18n="settings.density"></legend>
            <div class="segmented" id="density-row" role="radiogroup"></div>
          </fieldset>
          <fieldset>
            <legend data-i18n="settings.font_size"></legend>
            <div class="segmented" id="font-row" role="radiogroup"></div>
          </fieldset>
        </div>
      </section>

      <section>
        <h3 data-i18n="settings.language_time"></h3>
        <div class="two">
          <label class="field"><span data-i18n="settings.language"></span>
            <select id="s-language"></select>
          </label>
          <label class="field"><span data-i18n="settings.time_format"></span>
            <select id="s-time">
              <option value="24h" data-i18n="settings.time_24"></option>
              <option value="12h" data-i18n="settings.time_12"></option>
            </select>
          </label>
        </div>
      </section>

      <section>
        <h3 data-i18n="settings.behaviour"></h3>
        <label class="switch"><input id="s-events" type="checkbox"><span class="track" aria-hidden="true"></span><span data-i18n="settings.show_events"></span></label>
        <label class="switch"><input id="s-notify" type="checkbox"><span class="track" aria-hidden="true"></span><span data-i18n="settings.notifications"></span></label>
        <button id="btn-test-notify" type="button" class="quiet" data-i18n="settings.test_notification"></button>
        <label class="switch"><input id="s-tray" type="checkbox"><span class="track" aria-hidden="true"></span><span data-i18n="settings.close_to_tray"></span></label>
      </section>

      <section>
        <h3 data-i18n="settings.about"></h3>
        <dl class="about">
          <dt data-i18n="about.version"></dt><dd id="about-version"></dd>
          <dt data-i18n="about.license"></dt><dd id="about-license"></dd>
          <dt data-i18n="about.data"></dt><dd id="about-data" class="mono-wrap"></dd>
        </dl>
        <h4 data-i18n="about.shortcuts"></h4>
        <dl class="shortcuts" id="shortcut-list"></dl>
      </section>
    </div>
  </dialog>
</body>
</html>
