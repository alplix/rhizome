[package]
name = "rhizome-app"
description = "The Rhizome desktop application: engine and store behind a Tauri window"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
default-run = "rhizome"

[lib]
name = "rhizome_app"

[[bin]]
name = "rhizome"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rhizome-proto = { path = "../rhizome-proto" }
rhizome-client = { path = "../rhizome-client" }
rhizome-store = { path = "../rhizome-store" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tauri-plugin-notification = "2.4.0"
tauri-plugin-window-state = "2.4.1"

[lints]
workspace = true

[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "time", "sync"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.4.5"

# The operating system's credential store, for an opt-in "remember password".
# One backend per platform; only the Windows one has been built and tried.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }
