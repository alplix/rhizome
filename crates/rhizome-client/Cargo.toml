[package]
name = "rhizome-client"
description = "IRC client engine: connection, TLS, registration, session state and reconnect"
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true

[dependencies]
rhizome-proto = { path = "../rhizome-proto" }
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "sync", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "io-std", "io-util", "macros", "net", "time", "sync"] }

[lints]
workspace = true
